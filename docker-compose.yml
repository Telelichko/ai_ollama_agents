services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - '11434:11434'
    volumes:
      - 'D:/ollama_models:/root/.ollama'
    # GPU: раскомментируйте при наличии NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - 'OLLAMA_HOST=http://ollama:11434'
    entrypoint: sh -c 'sleep 5 && ollama pull qwen2.5-coder:3b'
    restart: 'no'

  farm:
    build: .
    environment:
      - 'OLLAMA_URL=http://ollama:11434'
      - 'OLLAMA_MODEL=qwen2.5-coder:3b'
    volumes:
      - './data:/app/data'
    depends_on:
      - ollama
