services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://0.0.0.0:11434 ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "✅ Ollama server is ready. Pulling models..."
        ollama pull llama3.2:3b
        ollama pull qwen2.5-coder:3b
        ollama pull mistral:7b
        echo "✅ All models pulled successfully!"
    restart: "no"

  farm:
    build: .
    depends_on:
      ollama-pull:
        condition: service_completed_successfully  # ← CRITICAL: Wait for downloads to finish
    environment:
      - OLLAMA_URL=http://ollama:11434